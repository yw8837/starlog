     bookmark ribbon on the bent ear, pencil behind the other ear, lavender cardigan, open book + quill);

.tl3{animation:w3 2.6s ease-in-out infinite;transform-origin:0% 100%}
.e1{transform-origin:50% 100%;animation:tw1 5s ease-in-out infinite}
.qu3{transform-origin:10% 90%;animation:wr3 1.4s ease-in-out infinite}
.hy3{opacity:0}.on .hy3{opacity:1}.on .op3{opacity:0}

@keyframes b3{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}

@keyframes j3{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px)}}
@keyframes ea{0%,100%{transform:rotate(0)}35%{transform:rotate(-14deg)}70%{transform:rotate(6deg)}}
@keyframes x3{0%{opacity:0;transform:scale(.2)}30%{opacity:1}100%{opacity:0;transform:scale(1.6)}}
