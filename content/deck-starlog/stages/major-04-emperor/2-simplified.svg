<title id="t">IV 황제 · 2단계 단순화 (The Emperor, simplified study)</title>
<desc id="d">1909 황제 카드의 구도를 평면 도형으로 단순화한 습작. 숫양 머리 돌 옥좌에 정면으로 앉은 인물, 왼손의 앙크 홀과 오른손의 구슬, 붉은 옷과 갑옷 다리, 뒤의 헐벗은 주황 산.</desc>
