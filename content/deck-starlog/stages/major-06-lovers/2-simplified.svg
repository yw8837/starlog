<title id="t">VI 연인 · 2단계 단순화 (The Lovers, simplified study)</title>
<desc id="d">1909 연인 카드의 구도를 평면 도형으로 단순화한 습작. 맨 위의 큰 해, 붉은 날개를 펼친 천사와 구름, 떨어져 선 두 사람(왼쪽은 천사를 올려다보고 오른쪽은 왼쪽을 본다), 뱀 감긴 열매 나무와 불꽃 나무, 가운데 산.</desc>
