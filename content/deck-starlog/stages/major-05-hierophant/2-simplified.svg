<title id="t">V 교황 · 2단계 단순화 (The Hierophant, simplified study)</title>
<desc id="d">1909 교황 카드의 구도를 평면 도형으로 단순화한 습작. 두 회색 기둥 사이에 정면으로 앉은 인물, 삼중관, 한 손의 축복, 다른 손의 삼중 십자 지팡이, 아래 모서리의 두 신도, 가운데 교차한 열쇠.</desc>
