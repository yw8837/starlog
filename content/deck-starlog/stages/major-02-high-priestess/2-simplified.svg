<title id="t">II 여사제 · 2단계 단순화 (The High Priestess, simplified study)</title>
<desc id="d">1909 여사제 카드의 구도를 평면 도형으로 단순화한 습작. 검은 기둥과 흰 기둥 사이 정면으로 앉은 인물, 석류 휘장, 뿔 달린 달 관, 무릎 위 두루마리, 발치의 초승달.</desc>
