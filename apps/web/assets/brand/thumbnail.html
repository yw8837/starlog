<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@500;700&display=block" rel="stylesheet">
<style>
  :root { --gold: #f3dca1; --ink: #f1ecff; --ink-sub: #c9c1ea; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body {
    background: radial-gradient(120% 90% at 78% 70%, #3b3596 0%, #221d63 38%, #120e38 72%, #0b0824 100%);
    font-family: "Noto Sans KR", sans-serif;
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
  }
  #sky { position: fixed; inset: 0; }
  .star { position: absolute; border-radius: 50%; background: #fff; }
  .stage { position: relative; width: 1200px; height: 630px; flex: none; transform-origin: center; }
  .text { position: absolute; left: 84px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { color: var(--gold); font-weight: 700; font-size: 24px; letter-spacing: 0.42em; }
  .name { margin-top: 10px; font-family: "Gowun Batang", serif; font-weight: 700; font-size: 104px; line-height: 1.05; letter-spacing: -0.01em;
          text-shadow: 0 6px 30px rgba(10, 6, 40, 0.6); }
  .tagline { margin-top: 26px; font-size: 32px; line-height: 1.5; color: var(--ink); font-weight: 500; }
  .tagline b { color: var(--gold); font-weight: 700; }
  .chips { margin-top: 30px; display: flex; gap: 10px; }
  .chip { padding: 8px 18px; border-radius: 999px; border: 1.5px solid rgba(243, 220, 161, 0.55); color: var(--gold); font-size: 21px; font-weight: 700;
          background: rgba(243, 220, 161, 0.08); }
  .host { position: absolute; left: 84px; bottom: 40px; color: var(--ink-sub); font-size: 20px; letter-spacing: 0.06em; }
  .art { position: absolute; right: 30px; top: 0; width: 560px; height: 630px; }
  .glow { position: absolute; left: 50%; top: 52%; width: 520px; height: 520px; transform: translate(-50%, -50%);
          background: radial-gradient(circle, rgba(255, 228, 160, 0.38) 0%, rgba(255, 210, 140, 0.12) 38%, rgba(255, 200, 120, 0) 66%); }
  .card { position: absolute; width: 168px; aspect-ratio: 600 / 1040; border-radius: 12px; background-size: cover;
          box-shadow: 0 18px 44px rgba(4, 2, 20, 0.6), 0 0 0 2px rgba(243, 220, 161, 0.35); top: 46px; }
  .c1 { left: 104px; transform: rotate(-15deg); }
  .c2 { left: 196px; top: 26px; transform: rotate(0deg); z-index: 1; }
  .c3 { left: 288px; transform: rotate(15deg); }
  .who { position: absolute; bottom: -6px; width: 330px; filter: drop-shadow(0 16px 26px rgba(4, 2, 20, 0.55)); z-index: 2; }
  .cat { left: -6px; }
  .rabbit { right: -14px; width: 318px; }
  .sparkle { position: absolute; color: var(--gold); z-index: 3; text-shadow: 0 0 12px rgba(255, 220, 140, 0.9); }
</style>
</head>
<body>
<div id="sky"></div>
<div class="stage" id="stage">
  <div class="text">
    <p class="eyebrow">STARLOG</p>
    <h1 class="name">스타로그</h1>
    <p class="tagline">타로와 사주로<br><b>내 고민</b>을 풀어 주는 곳</p>
    <div class="chips"><span class="chip">타로</span><span class="chip">사주</span><span class="chip">오늘의 한 장 무료</span></div>
  </div>
  <p class="host">starlog.yeolmaeapps.kr</p>
  <div class="art">
    <div class="glow"></div>
    <div class="card c1" style="background-image:url('file:///D:/Money/apps/saju-tarot/apps/web/public/cards/starlog/major-17-star.webp')"></div>
    <div class="card c2" style="background-image:url('file:///D:/Money/apps/saju-tarot/apps/web/public/cards/starlog/major-19-sun.webp')"></div>
    <div class="card c3" style="background-image:url('file:///D:/Money/apps/saju-tarot/apps/web/public/cards/starlog/major-18-moon.webp')"></div>
    <img class="who cat" src="file:///D:/Money/apps/saju-tarot/apps/web/public/characters/cat-tarot-card.v1-600.webp" alt="">
    <img class="who rabbit" src="file:///D:/Money/apps/saju-tarot/apps/web/public/characters/rabbit-hanbok.v2-600.webp" alt="">
    <span class="sparkle" style="left:44px; top:120px; font-size:30px">✦</span>
    <span class="sparkle" style="right:36px; top:96px; font-size:22px">✦</span>
    <span class="sparkle" style="left:250px; top:-2px; font-size:18px; opacity:.8">✦</span>
  </div>
</div>
<script>
  // Fixed star field (same picture every render), thinner over the text.
  let seed = 11;
  const next = () => ((seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296);
  const sky = document.getElementById("sky");
  for (let i = 0; i < 170; i++) {
    const x = next() * 100, y = next() * 100, r = 0.8 + next() * 2.2, a = 0.2 + next() * 0.65;
    const s = document.createElement("i");
    s.className = "star";
    Object.assign(s.style, { left: x + "vw", top: y + "vh", width: r + "px", height: r + "px", opacity: String(a), background: i % 9 === 0 ? "#f3dca1" : "#fff" });
    sky.appendChild(s);
  }
  // The 1200×630 design, scaled to fill the frame (portfolio cards are taller).
  const stage = document.getElementById("stage");
  const scale = Math.min(innerWidth / 1200, innerHeight / 630);
  stage.style.transform = `scale(${scale})`;
  // A taller frame: the characters sit on its bottom edge, the extra room goes above.
  if (innerHeight / innerWidth > 630 / 1200) {
    document.body.style.alignItems = "flex-end";
    stage.style.transformOrigin = "center bottom";
  }
</script>
</body>
</html>
