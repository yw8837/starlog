org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AdMob ids. PLACEHOLDERS: these are Google's public TEST ids
# (developers.google.com/admob/android/test-ads), so every build shows test ads.
# Before a production release pass the real ids instead, e.g.
#   ./gradlew bundleRelease -PADMOB_APP_ID=ca-app-pub-...~... -PADMOB_BANNER_ID=ca-app-pub-.../...
# or put them in ~/.gradle/gradle.properties (never commit real ids here).
ADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713
ADMOB_BANNER_ID=ca-app-pub-3940256099942544/9214589741

# Google web client id for native sign-in: the same public value as the web's GOOGLE_CLIENT_ID.
# Empty here; release builds refuse to build without it (pass -PGOOGLE_WEB_CLIENT_ID=..., or
# -PallowNoGoogleClientId=true on purpose). Release builds also refuse the test AdMob ids above
# unless -PallowTestAds=true.
GOOGLE_WEB_CLIENT_ID=

# Debug builds load https://starlog.yeolmaeapps.kr unless overridden with
#   ./gradlew assembleDebug -PstarlogUrl=http://10.0.2.2:3100
# Release builds always load https://starlog.yeolmaeapps.kr.
